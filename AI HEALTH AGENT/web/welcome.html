<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">

    <h2>Registration Form</h2>

    <form action="SaveDataServlet.do" method="post">

        <label>Title:</label>
        <div class="radio-group">
                <label class="radio-option"><input type="radio" name="title" value="Mr"> Mr</label>
                <label class="radio-option"><input type="radio" name="title" value="Ms"> Ms</label>
                <label class="radio-option"><input type="radio" name="title" value="Mrs"> Mrs</label>
        </div>

        <label>Name:</label>
<input type="text" placeholder="First Name" name="first_name" required>

<label>Surname:</label>
<input type="text" placeholder="Surname" name="surname" required>

<label for="dob">Date Of Birth</label>
<input type="date" id="dob" name="dob" required>

<label>Gender:</label>
<div class="radio-group">
    <label class="radio-option">
        <input type="radio" name="gender" value="male"> Male
    </label>
    <label class="radio-option">
        <input type="radio" name="gender" value="female"> Female
    </label>
</div>

<label>Marital Status:</label>
<select name="status">
    <option>Select Status</option>
    <option>Single</option>
    <option>Married</option>
    <option>Divorced</option>
</select>

<label>Email:</label>
<input type="email" placeholder="Email Address@gmail.com" name="email" required 
pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$">

<label>Cell Number:</label>
<input type="tel" placeholder="Cell Number" name="cell_number" required>

<label for="address">Address / Location:</label>
<p class="field-help">Use your device location or enter your address manually.</p>
<button class="secondary-action" type="button" id="useLocationBtn">Use device location</button>
<label class="checkbox-option">
    <input type="checkbox" id="manualAddress" name="manual_address" value="true">
    Enter address manually instead
</label>
<textarea id="address" placeholder="Address or device coordinates" name="address" required></textarea>
<input type="hidden" id="location_latitude" name="location_latitude">
<input type="hidden" id="location_longitude" name="location_longitude">
<div id="locationStatus" class="form-note"></div>
        <button type="submit">Submit</button>
        <a class="back-link" href="index.html">Back to home</a>
        <a class="back-link" href="user_sign.html">Already have an account? Sign in</a>

    </form>

</div>
    
<script src="registration.js"></script>

</body>
</html>
